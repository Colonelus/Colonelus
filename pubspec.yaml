name: sirdas_yeni
description: A new Flutter project.
publish_to: none
version: 1.0.0+56

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.0.0
  cloud_functions: ^5.0.0
  firebase_auth: ^5.0.0
  shared_preferences: ^2.5.3
  firebase_core: ^3.0.0
  google_sign_in: ^6.0.0
  intl: ^0.19.0
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^20.1.0
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.4.0+8
  app_links: ^6.4.1
  share_plus: ^11.0.0
  firebase_analytics: ^11.6.0
  purchases_flutter: ^9.16.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/sirdas_icon.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/images/sirdas_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/market_mock.png
    - assets/images/bottles/
    - assets/images/pearls/
    - assets/images/adminin_gemi.png
    - assets/images/sirdas_icon.png